<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2a7a" />
    <meta name="description" content="GO-GO Ride - smart local transport for West Bengal. Search buses, set arrival alarms, track buses and call local cars." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>GO-GO Ride</title>
    <script>
      // Apply the saved theme before the first paint, so a dark choice never flashes light.
      // Same rules as src/utils/theme.js, which takes over once the app starts.
      (function () {
        var choice = 'light'
        try {
          choice = localStorage.getItem('gogo.theme') || 'light'
        } catch (e) {}
        if (choice === 'auto') choice = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (location.pathname.indexOf('/admin') === 0) choice = 'light'
        document.documentElement.setAttribute('data-theme', choice === 'dark' ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
